<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>黑盒信道</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100%;
      height: 100vh;
      background: #0a0a0a;
      color: #00ff41;
      font-family: 'Courier New', Consolas, Monaco, monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    #full-modal {
      position: fixed;
      top:0;left:0;
      width:100%;height:100%;
      background:#0a0a0a;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding:20px;
      text-align:center;
    }
    .full-text{
      color:#ff4444;
      font-size:18px;
      letter-spacing:2px;
    }

    .header {
      padding: 12px 15px;
      background: #0f0f0f;
      border-bottom: 1px solid #00ff4133;
      text-align: center;
      letter-spacing: 2px;
      font-size: 15px;
      font-weight: bold;
      flex-shrink: 0;
    }
    .header .tip {
      font-size: 10px;
      opacity: 0.5;
      margin-top: 3px;
      letter-spacing: 1px;
      font-weight: normal;
    }
    .header .status {
      font-size: 10px;
      color: #ff4444;
      margin-top: 2px;
      opacity: 0.8;
    }

    .typing-tip {
      font-size: 11px;
      color: #00ff41;
      opacity: 0.7;
      padding: 4px 15px;
      background: #0f0f0f;
      text-align: center;
      flex-shrink: 0;
      height: 0;
      overflow: hidden;
      transition: height 0.2s;
    }
    .typing-tip.show { height: 22px; }

    #chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      transition: filter 0.2s;
    }
    #chat-box.blur { filter: blur(12px); }
    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-thumb { background: #00ff4133; border-radius: 2px; }

    .destroy-tip {
      text-align: center;
      color: #ff4444;
      font-size: 13px;
      margin-top: 20px;
      opacity: 0.8;
      letter-spacing: 1px;
    }

    .row {
      display: flex;
      margin-bottom: 12px;
      align-items: flex-end;
    }
    .row.left { justify-content: flex-start; }
    .row.right { justify-content: flex-end; }
    .bubble-wrap {
      max-width: 78%;
      display: flex;
      flex-direction: column;
    }
    .row.right .bubble-wrap { align-items: flex-end; }
    .bubble {
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.45;
      word-wrap: break-word;
      border-radius: 14px;
    }
    .row.left .bubble {
      background: #00ff411a;
      color: #00ff41;
      border: 1px solid #00ff4155;
      border-bottom-left-radius: 4px;
    }
    .row.right .bubble {
      background: #00ffff22;
      color: #00ffff;
      border: 1px solid #00ffff55;
      border-bottom-right-radius: 4px;
    }
    .row.right .bubble.fail {
      background: #ff44441a;
      color: #ff4444;
      border-color: #ff444455;
    }
    .read-mark {
      font-size: 10px;
      opacity: 0.5;
      margin-top: 3px;
      padding-right: 4px;
    }
    .fail-mark {
      font-size: 10px;
      color: #ff4444;
      margin-top: 3px;
      padding-right: 4px;
      opacity: 0.9;
    }

    #input-area {
      padding: 12px 15px;
      background: #0f0f0f;
      border-top: 1px solid #00ff4133;
      display: flex;
      gap: 10px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1;
      background: #000;
      border: 1px solid #00ff4166;
      color: #00ff41;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      -webkit-user-select: text;
      user-select: text;
    }
    #msg-input:focus { border-color: #00ff41; }
    button {
      padding: 0 18px;
      background: transparent;
      border: 1px solid #00ff41;
      color: #00ff41;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
    }
    button:active { background: #00ff4122; }

    @media print {
      body { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="full-modal" style="display:none;">
    <div class="full-text">房间占用<br/>当前最多2人同时在线</div>
  </div>

  <div class="header">
    <div>黑盒信道</div>
    <div class="tip">端到端加密 · 双人即毁</div>
    <div class="status" id="connect-status" style="display:none;">连接已断开</div>
  </div>

  <div class="typing-tip" id="typing-tip"></div>
  <div id="chat-box"></div>

  <div id="input-area">
    <input type="text" id="msg-input" placeholder="输入消息..." maxlength="200" />
    <button onclick="sendMessage()">发送</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('msg-input');
    const connectStatus = document.getElementById('connect-status');
    const typingTip = document.getElementById('typing-tip');
    const fullModal = document.getElementById('full-modal');

    const ROOM_ID = "default_room_001";
    const ENCRYPT_SECRET = "default_room_001";

    const me = 'u_' + Math.floor(Math.random() * 100000);
    let destroyed = false;
    let typingTimer = null;

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    window.addEventListener('blur', () => {
      if (!destroyed) chatBox.classList.add('blur');
    });
    window.addEventListener('focus', () => {
      chatBox.classList.remove('blur');
    });

    socket.on('disconnect', () => {
      if (!destroyed) {
        connectStatus.style.display = 'block';
      }
      hideTyping();
    });
    socket.on('connect', () => {
      connectStatus.style.display = 'none';
      if (!destroyed) {
        socket.emit('auto_join');
      }
    });

    socket.on('room_full', () => {
      fullModal.style.display = 'flex';
    });

    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    async function getKey(secret) {
      const keyHash = await crypto.subtle.digest('SHA-256', encoder.encode(secret));
      return crypto.subtle.importKey('raw', keyHash, { name: 'AES-CBC' }, false, ['encrypt', 'decrypt']);
    }
    async function encrypt(text, secret) {
      const key = await getKey(secret);
      const iv = crypto.getRandomValues(new Uint8Array(16));
      const encrypted = await crypto.subtle.encrypt({ name: 'AES-CBC', iv: iv }, key, encoder.encode(text));
      return {
        iv: btoa(String.fromCharCode(...iv)),
        data: btoa(String.fromCharCode(...new Uint8Array(encrypted)))
      };
    }
    async function decrypt(encryptedObj, secret) {
      try {
        const key = await getKey(secret);
        const iv = new Uint8Array(atob(encryptedObj.iv).split('').map(c => c.charCodeAt(0)));
        const data = new Uint8Array(atob(encryptedObj.data).split('').map(c => c.charCodeAt(0)));
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, key, data);
        return decoder.decode(decrypted);
      } catch (e) {
        return '[解密失败]';
      }
    }

    socket.on('room_history', async (history) => {
      chatBox.innerHTML = '';
      for (const item of history) {
        const text = await decrypt(item.encrypted, ENCRYPT_SECRET);
        addMessage(text, item.sender === me, item.msgId, false, false);
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on('room_destroy', () => {
      if (destroyed) return;
      destroyed = true;
      if (typingTimer) clearTimeout(typingTimer);
      hideTyping();
      chatBox.innerHTML = '';
      const tip = document.createElement('div');
      tip.className = 'destroy-tip';
      tip.textContent = '— 对方已退出，记录已销毁 —';
      chatBox.appendChild(tip);
      input.disabled = true;
      input.value = '';
      input.placeholder = '信道已断开';
    });

    socket.on('message_read', (msgId) => {
      const mark = document.querySelector(`[data-msg-id="${msgId}"] .read-mark`);
      if (mark) mark.textContent = '已读';
    });

    socket.on('receive_message', async (data) => {
      if (data.sender === me) return;
      const text = await decrypt(data.encrypted, ENCRYPT_SECRET);
      addMessage(text, false, data.msgId);
      socket.emit('read_receipt', { room: ROOM_ID, msgId: data.msgId });
    });

    function sendTyping() {
      if (destroyed) return;
      socket.emit('typing', { room: ROOM_ID, sender: me });
    }
    function sendStopTyping() {
      if (destroyed) return;
      socket.emit('stop_typing', { room: ROOM_ID, sender: me });
    }
    function showTyping() {
      typingTip.classList.add('show');
      typingTip.textContent = '对方正在输入...';
    }
    function hideTyping() {
      typingTip.classList.remove('show');
    }

    input.addEventListener('input', () => {
      if (destroyed) return;
      sendTyping();
      if (typingTimer) clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        sendStopTyping();
      }, 1000);
    });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || input.disabled) return;
      const msgId = Date.now() + '_' + Math.floor(Math.random() * 1000);

      if (typingTimer) clearTimeout(typingTimer);
      sendStopTyping();

      if (!socket.connected) {
        addMessage(text, true, msgId, true, true);
        input.value = '';
        input.focus();
        return;
      }

      const encrypted = await encrypt(text, ENCRYPT_SECRET);
      socket.emit('send_message', {
        room: ROOM_ID,
        msgId: msgId,
        sender: me,
        encrypted: encrypted
      });

      addMessage(text, true, msgId);
      input.value = '';
      input.focus();
    }

    function addMessage(text, isMe, msgId, scroll = true, isFail = false) {
      const row = document.createElement('div');
      row.className = 'row ' + (isMe ? 'right' : 'left');
      row.dataset.msgId = msgId;

      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';
      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (isFail ? ' fail' : '');
      bubble.textContent = text;
      wrap.appendChild(bubble);

      if (isMe) {
        const mark = document.createElement('div');
        if (isFail) {
          mark.className = 'fail-mark';
          mark.textContent = '发送失败';
        } else {
          mark.className = 'read-mark';
          mark.textContent = '';
        }
        wrap.appendChild(mark);
      }

      row.appendChild(wrap);
      chatBox.appendChild(row);
      if (scroll) chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
