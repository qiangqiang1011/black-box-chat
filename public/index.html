<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>黑盒信道</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100%;
      height: 100vh;
      background: #0a0a0a;
      color: #00ff41;
      font-family: 'Courier New', Consolas, Monaco, monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    #room-modal {
      position: fixed;
      top:0;left:0;
      width:100%;height:100%;
      background:#0a0a0a;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }
    #full-modal {
      position: fixed;
      top:0;left:0;
      width:100%;height:100%;
      background:#0a0a0a;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding:20px;
      text-align:center;
    }
    .full-text{
      color:#ff4444;
      font-size:18px;
      letter-spacing:2px;
    }

    .header {
      padding: 12px 15px;
      background: #0f0f0f;
      border-bottom: 1px solid #00ff4133;
      text-align: center;
      letter-spacing: 2px;
      font-size: 15px;
      font-weight: bold;
      flex-shrink: 0;
    }
    .header .tip {
      font-size: 10px;
      opacity: 0.5;
      margin-top: 3px;
      letter-spacing:1px;
      font-weight: normal;
    }
    .header .status {
      font-size: 10px;
      color: #ff4444;
      margin-top: 2px;
      opacity:0.8;
      display:none;
    }

    .typing-tip {
      font-size: 11px;
      color: #00ff41;
      opacity: 0.7;
      padding:4px 15px;
      background: #0f0f0f;
      text-align:center;
      flex-shrink:0;
      height:0;
      overflow:hidden;
      transition: height 0.2s;
    }
    .typing-tip.show { height:22px; }

    #chat-box {
      flex:1;
      padding:15px;
      overflow-y:auto;
      transition: filter 0.2s;
    }
    #chat-box.blur { filter: blur(12px); }
    #chat-box::-webkit-scrollbar { width:4px; }
    #chat-box::-webkit-scrollbar-thumb { background:#00ff4133; border-radius:2px; }

    .destroy-tip {
      text-align:center;
      color:#ff4444;
      font-size:13px;
      margin-top:20px;
      opacity:0.8;
      letter-spacing:1px;
    }
    .rebuild-tip {
      text-align:center;
      color:#00ff41;
      font-size:13px;
      margin-top:20px;
      opacity:0.8;
      letter-spacing:1px;
    }

    .row {
      display:flex;
      margin-bottom:12px;
      align-items:flex-end;
    }
    .row.left { justify-content:flex-start; }
    .row.right { justify-content:flex-end; }
    .bubble-wrap {
      max-width:78%;
      display:flex;
      flex-direction:column;
    }
    .bubble {
      padding:10px 14px;
      font-size:14px;
      line-height:1.45;
      word-wrap:break-word;
      border-radius:14px;
    }
    .row.left .bubble {
      background: rgba(0,255,65,0.1);
      color:#00ff41;
      border:1px solid rgba(0,255,65,0.33);
      border-bottom-left-radius:4px;
    }
    .row.right .bubble {
      background: rgba(0,255,255,0.1);
      color:#00ffff;
      border:1px solid rgba(0,255,255,0.33);
      border-bottom-right-radius:4px;
    }
    .row.right .bubble.fail {
      background:rgba(255,68,68,0.1);
      color:#ff4444;
      border-color:rgba(255,68,68,0.33);
    }
    .read-mark {
      font-size:10px;
      opacity:0.5;
      margin-top:3px;
      padding-right:4px;
    }
    .fail-mark {
      font-size:10px;
      color:#ff4444;
      margin-top:3px;
      padding-right:4px;
      opacity:0.9;
    }

    #input-area {
      padding:12px 15px;
      background:#0f0f0f;
      border-top:1px solid #00ff4133;
      display:flex;
      gap:10px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
      flex-shrink:0;
    }
    #msg-input {
      flex:1;
      background:#000;
      border:1px solid #00ff4166;
      color:#00ff41;
      padding:10px 14px;
      border-radius:20px;
      font-size:14px;
      outline:none;
      font-family: inherit;
      -webkit-user-select:text;
      user-select:text;
    }
    #msg-input:focus { border-color:#00ff41; }
    button {
      padding:0 18px;
      background:transparent;
      border:1px solid #00ff41;
      color:#00ff41;
      border-radius:20px;
      font-size:14px;
      cursor:pointer;
      font-family:inherit;
      transition:0.15s;
    }
    button:active { background:rgba(0,255,65,0.2); }

    /* 密钥弹窗样式 */
    #roomkey-input{
      background:#000;
      border:1px solid #00ff4166;
      color:#00ff41;
      padding:10px;
      border-radius:8px;
      font-size:16px;
      width:240px;
      outline:none;
      margin-bottom:15px;
    }
    #roomkey-input:focus{
      border-color:#00ff41;
    }
    #roomkey-tip{
      color:#ff4444;
      font-size:12px;
      margin-top:10px;
      display:none;
    }
  </style>
</head>
<body>
<div id="room-modal">
  <div style="text-align:center;">
    <div style="color:#00ff41;font-size:16px;margin-bottom:12px;">输入房间密钥</div>
    <input id="roomkey-input" type="text" placeholder="输入密钥">
    <br>
    <button onclick="enterRoom()">确认进入</button>
    <div id="roomkey-tip">房间已满</div>
  </div>
</div>

<div id="full-modal">
  <div class="full-text">房间占用<br/>当前最多2人同时在线</div>
</div>

<div class="header">
  <div>黑盒信道</div>
  <div class="tip">端到端加密 · 双人房间</div>
  <div class="status" id="connect-status">连接已断开</div>
</div>

<div class="typing-tip" id="typing-tip"></div>
<div id="chat-box"></div>

<div id="input-area">
  <input type="text" id="msg-input" placeholder="输入消息..." maxlength="200" onkeydown="if(event.key==='Enter')sendMessage()">
  <button onclick="sendMessage()">发送</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const chatBox = document.getElementById('chat-box');
const input = document.getElementById('msg-input');
const connectStatus = document.getElementById('connect-status');
const typingTip = document.getElementById('typing-tip');
const roomModal = document.getElementById('room-modal');
const roomkeyTip = document.getElementById('roomkey-tip');

let roomKey = "";
let enteredRoom = false;
let joining = false;
let isInRoom = false;

let me = 'u_' + Math.floor(Math.random()*1000000);
let destroyed = true;
let typingTimer = null;

function enterRoom(){
  const val = document.getElementById('roomkey-input').value.trim();
  if(!val || joining) return;
  roomKey = val;
  enteredRoom = true;
  joining = true;
  socket.emit('auto_join', roomKey);
  roomModal.style.display = 'none';
  destroyed = true;
  isInRoom = true;
  chatBox.innerHTML = '';
  const tip = document.createElement('div');
  tip.className = 'destroy-tip';
  tip.textContent = '✅ 房间已创建，等待其他人使用相同密钥接入';
  chatBox.appendChild(tip);
  input.disabled = true;
  input.placeholder = '等待对方上线...';
  setTimeout(()=>{joining=false;}, 800);
}

socket.on('disconnect', () => {
  connectStatus.style.display = 'block';
  connectStatus.textContent = '连接断开，正在重连...';
  hideTyping();
});

socket.on('connect', () => {
  connectStatus.style.display = 'none';
  // 只有标记进入房间，并且当前不在房间，才重新加入
  if(enteredRoom && roomKey && !isInRoom){
    socket.emit('auto_join', roomKey);
    isInRoom = true;
  }
});

socket.on('room_full', () => {
  roomkeyTip.style.display = 'block';
  setTimeout(()=>{roomkeyTip.style.display='none'},2500);
  roomModal.style.display = 'flex';
  enteredRoom = false;
  isInRoom = false;
});

socket.on('room_destroy', () => {
  destroyed = true;
  if(typingTimer) clearTimeout(typingTimer);
  hideTyping();
  chatBox.innerHTML = '';
  const tip = document.createElement('div');
  tip.className = 'destroy-tip';
  tip.textContent = '— 对方已退出，记录已销毁 —';
  chatBox.appendChild(tip);
  input.disabled = true;
  input.value = '';
  input.placeholder = '等待对方上线...';
});

socket.on('peer_online', () => {
  destroyed = false;
  chatBox.innerHTML = '';
  const tip = document.createElement('div');
  tip.className = 'rebuild-tip';
  tip.textContent = '对方接入成功，信道已建立';
  chatBox.appendChild(tip);
  input.disabled = false;
  input.placeholder = '输入消息...';
});

socket.on('message_read', (msgId) => {
  const mark = document.querySelector(`[data-msgid="${msgId}"] .read-mark`);
  if(mark) mark.textContent = '已读';
});

socket.on('receive_message', async (data) => {
  if(destroyed) return;
  const txt = await decrypt(data.encrypted, roomKey);
  addMessage(txt, false, data.msgId, true);
});

socket.on('user_typing', () => {
  if(destroyed) return;
  showTyping();
});
socket.on('user_stop_typing', () => {
  hideTyping();
});

input.addEventListener('input', ()=>{
  if(destroyed) return;
  socket.emit('typing', {room:roomKey, sender:me});
  clearTimeout(typingTimer);
  typingTimer = setTimeout(()=>{
    socket.emit('stop_typing', {room:roomKey, sender:me});
  },1000);
});

async function sendMessage() {
  const text = input.value.trim();
  if(!text || input.disabled) return;
  const msgId = Date.now() + '_' + Math.floor(Math.random()*1000000);
  clearTimeout(typingTimer);
  socket.emit('stop_typing', {room:roomKey, sender:me});

  if(!socket.connected){
    addMessage(text, true, msgId, true, true);
    input.value = '';
    return;
  }
  const enc = await encrypt(text, roomKey);
  socket.emit('send_message', {
    room:roomKey,
    msgId:msgId,
    sender:me,
    encrypted:enc
  });
  addMessage(text, true, msgId, false);
  input.value = '';
  scrollBottom();
}

function addMessage(text, isMe, msgId, scroll=true, fail=false) {
  const row = document.createElement('div');
  row.className = 'row ' + (isMe ? 'right':'left');
  row.setAttribute('data-msgid',msgId);
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (fail ? ' fail':'');
  bubble.textContent = text;
  const mark = document.createElement('div');
  mark.className = fail ? 'fail-mark' : 'read-mark';
  mark.textContent = fail ? '发送失败' : '';
  wrap.appendChild(bubble);
  wrap.appendChild(mark);
  row.appendChild(wrap);
  chatBox.appendChild(row);
  if(scroll) scrollBottom();
}
function scrollBottom(){
  chatBox.scrollTop = chatBox.scrollHeight;
}
function showTyping(){
  typingTip.textContent = '对方正在输入...';
  typingTip.classList.add('show');
}
function hideTyping(){
  typingTip.classList.remove('show');
}

const encoder = new TextEncoder();
const decoder = new TextDecoder();
async function getKey(secret){
  const hashBuf = await crypto.subtle.digest('SHA-256', encoder.encode(secret));
  return crypto.subtle.importKey('raw', hashBuf, {name:'AES-CBC'}, false, ['encrypt','decrypt']);
}
async function encrypt(text, secret){
  const key = await getKey(secret);
  const iv = crypto.getRandomValues(new Uint8Array(16));
  const encBuf = await crypto.subtle.encrypt({name:'AES-CBC', iv}, key, encoder.encode(text));
  return {
    iv: btoa(String.fromCharCode(...iv)),
    data: btoa(String.fromCharCode(...new Uint8Array(encBuf)))
  };
}
async function decrypt(obj, secret){
  try{
    const key = await getKey(secret);
    const iv = Uint8Array.from(atob(obj.iv), c=>c.charCodeAt(0));
    const data = Uint8Array.from(atob(obj.data), c=>c.charCodeAt(0));
    const plainBuf = await crypto.subtle.decrypt({name:'AES-CBC', iv}, key, data);
    return decoder.decode(plainBuf);
  }catch(e){
    return '[解密失败]';
  }
}
</script>
</body>
</html>
