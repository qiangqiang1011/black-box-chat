<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>私密空间</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at top,#141a2b 0%,#090c14 48%,#07080d 100%);color:#d8deea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;user-select:none}
    #roomPanel{position:fixed;inset:0;background:radial-gradient(circle at top,#141a2b 0%,#090c14 48%,#07080d 100%);padding:30px 18px 32px;overflow-y:auto;z-index:20}
    .panel-title{text-align:center;font-size:16px;letter-spacing:6px;color:#c0cbe2;margin-bottom:6px;font-weight:500}
    .panel-subtitle{text-align:center;font-size:11px;color:#4a5468;margin-bottom:26px;letter-spacing:2px}
    .room-item{max-width:520px;margin:10px auto;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:16px 18px}
    .room-left{display:flex;align-items:center;gap:14px}
    .room-number{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#1f2a44,#121826);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#c7d2ea}
    .room-name{font-size:14px;color:#e6ecf7}
    .room-status-right{display:flex;align-items:center;gap:10px}
    .online-text{font-size:12px;color:#7f8aa3}
    .enter-btn{border:1px solid rgba(120,180,255,.25);background:linear-gradient(135deg,rgba(90,140,255,.12),rgba(90,140,255,.04));color:#9cb8ff;padding:8px 14px;border-radius:12px;font-size:12px;letter-spacing:2px;cursor:pointer;font-family:inherit}
    .admin-btn-wrap{max-width:520px;margin:20px auto 0;text-align:center}
    .admin-btn{border:1px solid rgba(150,160,180,.2);background:rgba(255,255,255,.02);color:#9aa5c0;padding:10px 20px;border-radius:10px;font-size:12px;cursor:pointer;font-family:inherit}
    .rule-box{max-width:520px;margin:24px auto 0;padding:16px 18px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);font-size:11px;line-height:1.8;color:#6b7590}
    .rule-box h4{color:#9aa5c0;font-size:12px;margin-bottom:8px;font-weight:500}
    .rule-box ul{list-style:none;padding-left:0}
    .rule-box li{padding-left:14px;position:relative;margin-bottom:4px}
    .rule-box li::before{content:"·";position:absolute;left:0;color:#4a5468}
    .disclaimer{font-size:11px;color:#4a5468;text-align:center;padding:20px 12px 12px;line-height:1.5}

    .nav-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.04);background:rgba(7,8,13,.6);backdrop-filter:blur(10px)}
    .nav-title{font-size:12px;letter-spacing:3px;color:#7f8aa3}
    .nav-room{font-size:14px;color:#e6ecf7;font-weight:600}
    .back-btn{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#9ca6bd;padding:7px 12px;border-radius:10px;font-size:11px;letter-spacing:2px;cursor:pointer;font-family:inherit}

    #chat{flex:1;padding:18px 16px;overflow-y:auto}
    .tip-card{max-width:72%;margin:18px auto;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.06);text-align:center}
    .tip-title{font-size:13px;color:#e6ecf7;margin-bottom:4px}
    .tip-desc{font-size:11px;color:#5d6780}

    .row{display:flex;margin-bottom:14px}
    .row.l{justify-content:flex-start}
    .row.r{justify-content:flex-end}
    .bubble{max-width:74%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap;color:#fff}
    .bubble.color-0{background:#4a7bd9}
    .bubble.color-1{background:#2e9e62}
    .bubble.color-2{background:#c9a231}
    .bubble.color-3{background:#c24f82}
    .bubble.color-4{background:#d17a38}

    #inputBox{display:flex;gap:10px;padding:12px 14px 16px;border-top:1px solid rgba(255,255,255,.04);background:rgba(7,8,13,.6)}
    #txt{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:#e6ecf7;padding:12px 14px;border-radius:20px;outline:none;font-size:14px;font-family:inherit}
    #txt::placeholder{color:#4a5468}
    #send{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#4f78d1,#3657a8);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(54,87,168,.45)}
    .send-icon{width:18px;height:18px}

    .pwd-modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:99}
    .pwd-modal{width:320px;background:#121826;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px}
    .pwd-modal h3{color:#e6ecf7;font-size:15px;margin-bottom:16px;text-align:center;font-weight:500}
    .pwd-modal input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#e6ecf7;padding:12px;border-radius:10px;font-size:14px;outline:none;margin-bottom:16px;text-align:center;letter-spacing:2px}
    .pwd-modal .pwd-list{margin-bottom:16px;line-height:2;font-size:13px;color:#c0cbe2}
    .pwd-modal .pwd-list li{display:flex;justify-content:space-between;list-style:none;border-bottom:1px solid rgba(255,255,255,.04);padding:4px 0}
    .pwd-modal-btns{display:flex;gap:10px}
    .pwd-modal-btn{flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;cursor:pointer;font-family:inherit}
    .btn-primary{background:linear-gradient(135deg,#4f78d1,#3657a8);color:#fff}
    .btn-cancel{background:rgba(255,255,255,.04);color:#9ca6bd}
  </style>
</head>
<body>
  <div id="roomPanel">
    <div class="panel-title">私密空间</div>
    <div class="panel-subtitle">PRIVATE SPACE · 8 ROOMS</div>
    <div id="list"></div>
    <div class="admin-btn-wrap">
      <button class="admin-btn" id="adminBtn">管理员查看今日房间密码</button>
    </div>
    <div class="rule-box">
      <h4>销毁规则</h4>
      <ul>
        <li>服务端全程仅转发消息，不存储任何聊天内容、访问日志</li>
        <li>任意一人退出，所有人本地聊天记录自动清空，房间不解散</li>
        <li>点击返回仅销毁本地记录并退出房间，不会强制对方退出</li>
        <li>切换浏览器标签页/切后台，本地会话记录自动销毁</li>
        <li>关闭浏览器标签页，所有会话数据自动从内存清除</li>
      </ul>
    </div>
    <div class="disclaimer">本服务不会保存聊天记录，退出即销毁！</div>
  </div>

  <div class="nav-bar">
    <button class="back-btn" id="backBtn">返回</button>
    <div>
      <div class="nav-title">当前房间</div>
      <div class="nav-room" id="navRoom">—</div>
    </div>
    <div style="font-size:11px;color:#7f8aa3" id="navStatus">等待中</div>
  </div>

  <div id="chat"></div>

  <div id="inputBox">
    <input id="txt" placeholder="输入消息..." maxlength="500">
    <button id="send">
      <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ transports: ['websocket'] });

    const roomPanel = document.getElementById('roomPanel');
    const listWrap = document.getElementById('list');
    const chat = document.getElementById('chat');
    const txt = document.getElementById('txt');
    const sendBtn = document.getElementById('send');
    const backBtn = document.getElementById('backBtn');
    const navRoom = document.getElementById('navRoom');
    const navStatus = document.getElementById('navStatus');
    const adminBtn = document.getElementById('adminBtn');

    let inRoom = false;
    let modal = null;
    let joinLock = false;
    let userList = [];
    const colorClasses = ['color-0','color-1','color-2','color-3','color-4'];

    function getUserColorIndex(userId) {
      const idx = userList.indexOf(userId);
      return idx === -1 ? 0 : idx % colorClasses.length;
    }

    function clearChat() {
      chat.innerHTML = '';
    }

    // 渲染房间列表
    function renderList() {
      listWrap.innerHTML = '';
      for (let i = 1; i <= 8; i++) {
        const item = document.createElement('div');
        item.className = 'room-item';
        item.id = 'r' + i;
        item.innerHTML = `
          <div class="room-left">
            <div class="room-number">${i}</div>
            <div class="room-name">房间 ${i}</div>
          </div>
          <div class="room-status-right">
            <span class="online-text">0人在线</span>
            <button class="enter-btn">进入</button>
          </div>`;
        item.querySelector('.enter-btn').onclick = () => openPwd(i);
        listWrap.appendChild(item);
      }
    }
    renderList();

    // 密码弹窗
    function openPwd(roomNum) {
      if (joinLock) return;
      if (modal) modal.remove();

      const mask = document.createElement('div');
      mask.className = 'pwd-modal-mask';
      mask.innerHTML = `
        <div class="pwd-modal">
          <h3>请输入房间${roomNum}密码</h3>
          <input id="pwdInput" maxlength="4" placeholder="4位数字密码" inputmode="numeric">
          <div class="pwd-modal-btns">
            <button class="pwd-modal-btn btn-cancel" id="cancelBtn">取消</button>
            <button class="pwd-modal-btn btn-primary" id="okBtn">确认进入</button>
          </div>
        </div>`;
      document.body.appendChild(mask);
      modal = mask;

      const input = mask.querySelector('#pwdInput');
      const okBtn = mask.querySelector('#okBtn');
      input.focus();

      mask.querySelector('#cancelBtn').onclick = () => {
        mask.remove();
        modal = null;
      };

      function submit() {
        if (joinLock) return;
        const pwd = input.value.trim();
        if (!/^\d{4}$/.test(pwd)) {
          alert('请输入4位数字密码');
          return;
        }
        joinLock = true;
        okBtn.disabled = true;
        okBtn.textContent = '进入中...';
        socket.emit('join', { roomNum, password: pwd });
      }

      okBtn.onclick = submit;
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
      });
    }

    // 管理员入口
    adminBtn.onclick = () => {
      if (modal) modal.remove();
      const mask = document.createElement('div');
      mask.className = 'pwd-modal-mask';
      mask.innerHTML = `
        <div class="pwd-modal">
          <h3>请输入管理员密码</h3>
          <input type="password" id="adminInput" placeholder="请输入总密码">
          <div class="pwd-modal-btns">
            <button class="pwd-modal-btn btn-cancel" id="cancelAdmin">取消</button>
            <button class="pwd-modal-btn btn-primary" id="okAdmin">确认</button>
          </div>
        </div>`;
      document.body.appendChild(mask);
      modal = mask;
      const input = mask.querySelector('#adminInput');
      input.focus();

      mask.querySelector('#cancelAdmin').onclick = () => {
        mask.remove();
        modal = null;
      };
      mask.querySelector('#okAdmin').onclick = () => {
        const pwd = input.value.trim();
        if (!pwd) return;
        socket.emit('admin_get', pwd);
        mask.remove();
        modal = null;
      };
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') mask.querySelector('#okAdmin').click();
      });
    };

    socket.on('admin_result', list => {
      let html = '<ul class="pwd-list">';
      list.forEach((pwd, idx) => {
        html += `<li><span>房间 ${idx+1}</span><span>${pwd}</span></li>`;
      });
      html += '</ul>';
      const mask = document.createElement('div');
      mask.className = 'pwd-modal-mask';
      mask.innerHTML = `
        <div class="pwd-modal">
          <h3>今日房间密码</h3>
          ${html}
          <div class="pwd-modal-btns">
            <button class="pwd-modal-btn btn-primary" style="flex:1" id="closeBtn">我知道了</button>
          </div>
        </div>`;
      document.body.appendChild(mask);
      modal = mask;
      mask.querySelector('#closeBtn').onclick = () => {
        mask.remove();
        modal = null;
      };
    });

    // 房间列表状态更新
    socket.on('room_status', arr => {
      arr.forEach(v => {
        const dom = document.getElementById('r' + v.num);
        if (!dom) return;
        const text = dom.querySelector('.online-text');
        if (text) text.textContent = v.online + '人在线';
      });
    });

    // 返回按钮
    backBtn.addEventListener('click', () => {
      socket.emit('leave_room');
      clearChat();
      userList = [];
      inRoom = false;
      roomPanel.style.display = 'block';
      navRoom.textContent = '—';
      navStatus.textContent = '等待中';
    });

    // 切后台自动清空记录
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && inRoom) {
        clearChat();
      }
    });

    // 自己进入房间成功
    socket.on('joined', res => {
      joinLock = false;
      if (modal) { modal.remove(); modal = null; }

      userList = [socket.id];
      inRoom = true;
      roomPanel.style.display = 'none';
      navRoom.textContent = '房间 ' + res.roomNum;
      navStatus.textContent = '在线 ' + res.count + ' 人';
      clearChat();

      const tip = document.createElement('div');
      tip.className = 'tip-card';
      tip.innerHTML = '<div class="tip-title">已进入房间</div><div class="tip-desc">当前在线 ' + res.count + ' 人</div>';
      chat.appendChild(tip);

      txt.focus();
    });

    // 有人加入房间
    socket.on('user_join', data => {
      if (!inRoom) return;
      if (!userList.includes(data.id)) {
        userList.push(data.id);
      }
      // 更新右上角在线人数
      navStatus.textContent = '在线 ' + data.count + ' 人';

      const tip = document.createElement('div');
      tip.className = 'tip-card';
      tip.innerHTML = '<div class="tip-title">有人加入</div><div class="tip-desc">当前在线 ' + data.count + ' 人</div>';
      chat.appendChild(tip);
      chat.scrollTop = chat.scrollHeight;
    });

    // 有人退出房间
    socket.on('user_leave', data => {
      if (!inRoom) return;
      userList = userList.filter(id => id !== data.id);
      // 修复：更新右上角在线人数
      navStatus.textContent = '在线 ' + data.count + ' 人';
    });

    // 清空聊天指令（有人退出时触发）
    socket.on('clear_chat', () => {
      if (!inRoom) return;
      clearChat();
      const tip = document.createElement('div');
      tip.className = 'tip-card';
      tip.innerHTML = '<div class="tip-title">有人退出</div><div class="tip-desc">本地记录已自动清空</div>';
      chat.appendChild(tip);
      chat.scrollTop = chat.scrollHeight;
    });

    // 收到消息
    socket.on('recv_msg', data => {
      if (!inRoom) return;
      addMsg(data.text, data.id);
    });

    // 发送消息
    sendBtn.addEventListener('click', () => {
      const val = txt.value.trim();
      if (!val || !inRoom) return;
      socket.emit('send_msg', val);
      addMsg(val, socket.id);
      txt.value = '';
      chat.scrollTop = chat.scrollHeight;
    });

    // 回车发送
    txt.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });

    // 添加消息气泡（按用户id取颜色）
    function addMsg(text, userId) {
      const isMe = userId === socket.id;
      const row = document.createElement('div');
      row.className = 'row ' + (isMe ? 'r' : 'l');
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + colorClasses[getUserColorIndex(userId)];
      bubble.textContent = text;
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    // 通用提示
    socket.on('tip', msg => {
      joinLock = false;
      alert(msg);
    });

    // 关闭页面自动清除
    window.addEventListener('beforeunload', () => {
      clearChat();
      userList = [];
    });
  </script>
</body>
</html>
